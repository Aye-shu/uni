<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Bus – UniBus Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/admin/admin.css">

    <style>
        .form-card {
            background: #fff;
            border: 1px solid var(--border, #e5e7eb);
            border-radius: 16px;
            padding: 28px;
            max-width: 700px;
            margin: 24px 28px;
        }
        .form-card h2 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.3rem;
            margin: 0 0 22px;
            color: var(--dark);
            display: flex; align-items: center; gap: 10px;
        }
        .form-card h2 i { color: var(--primary); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .form-row.full { grid-template-columns: 1fr; }
        .form-field { display: flex; flex-direction: column; gap: 6px; }
        .form-field label { font-size: 0.82rem; font-weight: 600; color: var(--dark); }
        .form-field input,
        .form-field select,
        .form-field textarea {
            padding: 12px 14px;
            border: 1.5px solid var(--border, #e5e7eb);
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }
        .form-field input:focus,
        .form-field select:focus,
        .form-field textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(249,115,22,0.15);
        }
        .form-actions { display: flex; gap: 10px; margin-top: 24px; }
        .btn-cancel {
            flex: 1; padding: 12px; border-radius: 10px;
            border: 1.5px solid var(--border); background: #fff;
            font-weight: 600; cursor: pointer; text-decoration: none;
            color: var(--dark); text-align: center;
        }
        .btn-submit {
            flex: 2; padding: 12px; border-radius: 10px; border: none;
            background: var(--primary); color: #fff; font-weight: 700;
            cursor: pointer; display: inline-flex; justify-content: center;
            align-items: center; gap: 8px;
            box-shadow: 0 6px 16px rgba(249,115,22,0.3);
        }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-cancel:hover { background: #f9fafb; }

        @media (max-width: 640px) {
            .form-row { grid-template-columns: 1fr; }
            .form-card { margin: 16px; padding: 20px; }
        }
    </style>
</head>
<body>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <span class="brand-icon">🚌</span>
        <span class="brand-text">Uni<span>Bus</span></span>
    </div>
    <nav class="sidebar-nav">
        <a href="/admin/dashboard.html" class="nav-item"><i class="fas fa-th-large"></i><span>Dashboard</span></a>
        <a href="/admin/buses.html" class="nav-item active"><i class="fas fa-bus"></i><span>Manage Buses</span></a>
        <a href="/admin/routes.html" class="nav-item"><i class="fas fa-route"></i><span>Manage Routes</span></a>
        <a href="/admin/drivers.html" class="nav-item"><i class="fas fa-id-card"></i><span>Manage Drivers</span></a>
        <a href="/admin/schedules.html" class="nav-item"><i class="fas fa-calendar-alt"></i><span>Schedules</span></a>
        <a href="/admin/live-buses.html" class="nav-item"><i class="fas fa-map-marked-alt"></i><span>Live Monitoring</span></a>
        <a href="/admin/reports.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Reports</span></a>
        <a href="/admin/users.html" class="nav-item"><i class="fas fa-users"></i><span>Users</span></a>
        <a href="/admin/notifications.html" class="nav-item"><i class="fas fa-bell"></i><span>Notifications</span></a>
        <a href="/admin/profile.html" class="nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
    </nav>
    <div class="sidebar-footer">
        <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></button>
    </div>
</aside>

<div class="main-content" id="mainContent">
    <header class="topbar">
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
        <div class="topbar-right">
            <a href="/admin/notifications.html" class="icon-btn" title="Notifications">
                <i class="fas fa-bell"></i>
                <span class="badge" id="notifBadge">0</span>
            </a>
            <a href="/admin/profile.html" class="user-menu" title="My Profile">
                <div class="user-avatar" id="userAvatar">A</div>
                <div class="user-info">
                    <span class="user-name" id="userName">Admin</span>
                    <span class="user-role" id="userRole">admin</span>
                </div>
            </a>
        </div>
    </header>

    <div class="page-header" style="padding: 24px 28px 0;">
        <div>
            <h1>Add New Bus</h1>
            <p>Register a new bus in the fleet.</p>
        </div>
        <a href="/admin/buses.html" class="btn-back" style="background:#f1f5f9;padding:11px 20px;border-radius:10px;font-weight:600;font-size:0.88rem;text-decoration:none;color:var(--dark);display:inline-flex;align-items:center;gap:8px;">
            <i class="fas fa-arrow-left"></i> Back to Buses
        </a>
    </div>

    <form class="form-card" id="addBusForm">
        <h2><i class="fas fa-bus"></i> Bus Details</h2>

        <div class="form-row">
            <div class="form-field">
                <label for="busNumber">Bus Number *</label>
                <input type="text" id="busNumber" placeholder="e.g. UB-05" required />
            </div>
            <div class="form-field">
                <label for="plateNumber">Plate Number *</label>
                <input type="text" id="plateNumber" placeholder="e.g. DHAKA-METRO-1234" required />
            </div>
        </div>

        <div class="form-row">
            <div class="form-field">
                <label for="capacity">Capacity *</label>
                <input type="number" id="capacity" min="1" max="100" value="40" required />
            </div>
            <div class="form-field">
                <label for="model">Model</label>
                <input type="text" id="model" placeholder="e.g. Toyota Coaster 2020" />
            </div>
        </div>

        <div class="form-row full">
            <div class="form-field">
                <label for="route">Assigned Route</label>
                <select id="route"><option value="">— No route assigned —</option></select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-field">
                <label for="status">Status</label>
                <select id="status">
                    <option value="active" selected>Active</option>
                    <option value="maintenance">Maintenance</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>
            <div class="form-field">
                <label for="year">Year</label>
                <input type="number" id="year" min="1980" max="2100" placeholder="e.g. 2020" />
            </div>
        </div>

        <div class="form-row full">
            <div class="form-field">
                <label for="notes">Notes (optional)</label>
                <textarea id="notes" rows="3" placeholder="Any additional info..."></textarea>
            </div>
        </div>

        <div class="form-actions">
            <a href="/admin/buses.html" class="btn-cancel">Cancel</a>
            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fas fa-plus-circle"></i> Add Bus
            </button>
        </div>
    </form>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="../js/api.js"></script>
<script>
    let user = null;
    const form = document.getElementById('addBusForm');

    document.addEventListener('DOMContentLoaded', async () => {
        user = await checkAuth();
        if (!user) return;

        document.getElementById('userName').textContent = user.name || 'Admin';
        document.getElementById('userRole').textContent = user.role || 'admin';
        document.getElementById('userAvatar').textContent = (user.name || 'A').charAt(0).toUpperCase();

        // Sidebar
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        menuToggle?.addEventListener('click', () => sidebar.classList.toggle('open'));

        // Logout
        document.getElementById('logoutBtn')?.addEventListener('click', async () => {
            try { await fetch('/api/auth/sign-out', { method: 'POST', credentials: 'include' }); } catch {}
            window.location.href = '/login.html';
        });

        // Load routes for dropdown
        try {
            const res = await fetch('/api/routes', { credentials: 'include' });
            const data = await res.json();
            const select = document.getElementById('route');
            (data.data || []).forEach(r => {
                const opt = document.createElement('option');
                opt.value = r._id;
                opt.textContent = r.name || 'Unnamed route';
                select.appendChild(opt);
            });
        } catch {}
    });

    async function checkAuth() {
        try {
            const res = await fetch('/api/auth/get-session', { credentials: 'include' });
            const data = await res.json();
            if (!data.user) throw new Error();
            if (data.user.role !== 'admin') {
                window.location.href = '/login.html';
                return null;
            }
            return data.user;
        } catch {
            window.location.href = '/login.html';
            return null;
        }
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const original = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Adding...';

        const body = {
            busNumber: document.getElementById('busNumber').value.trim(),
            plateNumber: document.getElementById('plateNumber').value.trim(),
            capacity: Number(document.getElementById('capacity').value) || 40,
            model: document.getElementById('model').value.trim(),
            route: document.getElementById('route').value || null,
            status: document.getElementById('status').value,
            year: document.getElementById('year').value ? Number(document.getElementById('year').value) : null,
            notes: document.getElementById('notes').value.trim(),
        };

        try {
            const res = await fetch('/api/admin/buses', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify(body),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || 'Failed to add bus');

            showToast('success', 'Bus added', `${body.busNumber} has been registered.`);
            setTimeout(() => window.location.href = '/admin/buses.html', 1200);
        } catch (err) {
            showToast('error', 'Add failed', err.message);
            btn.disabled = false;
            btn.innerHTML = original;
        }
    });

    function showToast(type, title, message = '') {
        const container = document.getElementById('toastContainer');
        const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `
            <i class="fas ${icons[type]}"></i>
            <div class="toast-content">
                <h5>${title}</h5>
                ${message ? `<p>${message}</p>` : ''}
            </div>`;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = '0.3s';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }
</script>
</body>
</html>
