<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Classes – UniBus</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Dashboard base styles (sidebar, topbar) -->
    <link rel="stylesheet" href="/css/dashboard.css">

    <!-- Classes page styles -->
    <link rel="stylesheet" href="/css/classes.css">
</head>
<body>

<!-- ============================================================
     SIDEBAR
============================================================ -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <span class="brand-icon">🚌</span>
        <span class="brand-text">Uni<span>Bus</span></span>
    </div>

    <nav class="sidebar-nav">
        <a href="/student/dashboard.html" class="nav-item">
            <i class="fas fa-th-large"></i><span>Dashboard</span>
        </a>
        <a href="/student/classes.html" class="nav-item active">
            <i class="fas fa-calendar-alt"></i><span>My Classes</span>
        </a>
        <a href="/student/find-bus.html" class="nav-item">
            <i class="fas fa-search"></i><span>Find Bus</span>
        </a>
        <a href="/student/bookings.html" class="nav-item">
            <i class="fas fa-ticket-alt"></i><span>My Bookings</span>
        </a>
        <a href="/student/track-bus.html" class="nav-item">
            <i class="fas fa-map-marked-alt"></i><span>Track Bus</span>
        </a>
        <a href="/student/profile.html" class="nav-item">
            <i class="fas fa-user"></i><span>Profile</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <button class="logout-btn" id="logoutBtn">
            <i class="fas fa-sign-out-alt"></i><span>Logout</span>
        </button>
    </div>
</aside>

<!-- ============================================================
     MAIN CONTENT
============================================================ -->
<div class="main-content" id="mainContent">

    <!-- TOP BAR -->
    <header class="topbar">
        <button class="menu-toggle" id="menuToggle">
            <i class="fas fa-bars"></i>
        </button>

        <div class="topbar-right">
            <div class="user-menu">
                <div class="user-avatar" id="userAvatar">S</div>
                <div class="user-info">
                    <span class="user-name" id="userName">Student</span>
                    <span class="user-role" id="userRole">student</span>
                </div>
            </div>
        </div>
    </header>

    <!-- PAGE HEADER -->
    <div class="page-header">
        <div>
            <h1>My Classes</h1>
            <p>Add your weekly class schedule to get smart bus recommendations.</p>
        </div>
        <button class="btn-add" id="addClassBtn">
            <i class="fas fa-plus"></i> Add Class
        </button>
    </div>

    <!-- FILTER BAR -->
    <div class="filter-bar">
        <div class="filter-group">
            <label><i class="fas fa-filter"></i> Filter by day:</label>
            <select id="dayFilter">
                <option value="all">All Days</option>
                <option value="Sunday">Sunday</option>
                <option value="Monday">Monday</option>
                <option value="Tuesday">Tuesday</option>
                <option value="Wednesday">Wednesday</option>
                <option value="Thursday">Thursday</option>
                <option value="Friday">Friday</option>
                <option value="Saturday">Saturday</option>
            </select>
        </div>
        <div class="class-count" id="classCount">0 classes</div>
    </div>

    <!-- CLASSES LIST -->
    <div id="classesContainer">
        <!-- Loading skeleton shown initially, replaced by JS -->
        <div class="loading-skeleton">
            <div class="skeleton-line"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line"></div>
        </div>
    </div>

</div>

<!-- ============================================================
     ADD / EDIT CLASS MODAL
============================================================ -->
<div class="modal-overlay" id="classModal">
    <div class="modal-box">
        <div class="modal-header">
            <h2 id="modalTitle">Add New Class</h2>
            <button class="modal-close" id="closeModalBtn">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <form id="classForm">
            <input type="hidden" id="classId" />

            <div class="form-row">
                <div class="form-field">
                    <label>Course Name <span class="req">*</span></label>
                    <input type="text" id="courseName" placeholder="e.g. Data Structures" required />
                    <span class="field-error" id="errCourseName"></span>
                </div>

                <div class="form-field">
                    <label>Course Code <span class="req">*</span></label>
                    <input type="text" id="courseCode" placeholder="e.g. CSE201" required />
                    <span class="field-error" id="errCourseCode"></span>
                </div>
            </div>

            <div class="form-field">
                <label>Day <span class="req">*</span></label>
                <select id="day" required>
                    <option value="" disabled selected>Select day</option>
                    <option value="Sunday">Sunday</option>
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                    <option value="Saturday">Saturday</option>
                </select>
                <span class="field-error" id="errDay"></span>
            </div>

            <div class="form-row">
                <div class="form-field">
                    <label>Start Time <span class="req">*</span></label>
                    <input type="time" id="startTime" required />
                    <span class="field-error" id="errStartTime"></span>
                </div>

                <div class="form-field">
                    <label>End Time <span class="req">*</span></label>
                    <input type="time" id="endTime" required />
                    <span class="field-error" id="errEndTime"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-field">
                    <label>Location / Building</label>
                    <input type="text" id="location" placeholder="e.g. CSE Building" />
                </div>

                <div class="form-field">
                    <label>Room (Optional)</label>
                    <input type="text" id="room" placeholder="e.g. 302" />
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
                <button type="submit" class="btn-save" id="saveBtn">
                    <i class="fas fa-save"></i> Save Class
                </button>
            </div>
        </form>
    </div>
</div>

<!-- ============================================================
     DELETE CONFIRMATION MODAL
============================================================ -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal-box modal-sm">
        <div class="modal-header danger">
            <h2><i class="fas fa-exclamation-triangle"></i> Delete Class</h2>
        </div>
        <div class="modal-body">
            <p>Are you sure you want to delete <strong id="deleteClassName">this class</strong>?</p>
            <p class="modal-hint">This action cannot be undone.</p>
        </div>
        <div class="modal-actions">
            <button type="button" class="btn-cancel" id="cancelDeleteBtn">Cancel</button>
            <button type="button" class="btn-danger" id="confirmDeleteBtn">
                <i class="fas fa-trash"></i> Delete
            </button>
        </div>
    </div>
</div>

<!-- ============================================================
     TOAST CONTAINER
============================================================ -->
<div class="toast-container" id="toastContainer"></div>

<!-- Scripts -->
<script src="/js/student/classes.js"></script>
</body>
</html>
