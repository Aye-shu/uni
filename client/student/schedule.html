<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bus Schedule – UniBus</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/schedule.css">
</head>
<body>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <span class="brand-icon">🚌</span>
        <span class="brand-text">Uni<span>Bus</span></span>
    </div>
    <nav class="sidebar-nav">
        <a href="/student/dashboard.html" class="nav-item"><i class="fas fa-th-large"></i><span>Dashboard</span></a>
        <a href="/student/classes.html" class="nav-item"><i class="fas fa-calendar-alt"></i><span>My Classes</span></a>
        <a href="/student/find-bus.html" class="nav-item"><i class="fas fa-search"></i><span>Find Bus</span></a>
        <a href="/student/bookings.html" class="nav-item"><i class="fas fa-ticket-alt"></i><span>My Bookings</span></a>
        <a href="/student/track-bus.html" class="nav-item"><i class="fas fa-map-marked-alt"></i><span>Track Bus</span></a>
        <a href="/student/profile.html" class="nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
    </nav>
    <div class="sidebar-footer">
        <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></button>
    </div>
</aside>

<div class="main-content" id="mainContent">
    <header class="topbar">
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
        <div class="topbar-right">
            <div class="user-menu">
                <div class="user-avatar" id="userAvatar">S</div>
                <div class="user-info">
                    <span class="user-name" id="userName">Student</span>
                    <span class="user-role" id="userRole">student</span>
                </div>
            </div>
        </div>
    </header>

    <div class="page-header">
        <div>
            <h1>Bus Schedule</h1>
            <p>Full timetable of bus departures.</p>
        </div>
        <a href="/student/find-bus.html" class="btn-book">
            <i class="fas fa-ticket-alt"></i> Book a Seat
        </a>
    </div>

    <div class="schedule-filters">
        <div class="filter-field">
            <label><i class="fas fa-calendar-day"></i> Day</label>
            <select id="dayFilter"></select>
        </div>
        <div class="filter-field">
            <label><i class="fas fa-exchange-alt"></i> Direction</label>
            <select id="directionFilter">
                <option value="outbound">Outbound (Home → Campus)</option>
                <option value="return">Return (Campus → Home)</option>
            </select>
        </div>
    </div>

    <div id="scheduleTable">
        <div class="loading-skeleton">
            <div class="skeleton-card"></div>
        </div>
    </div>
</div>

  <script src="../js/api.js"></script>
<script src="/js/student/schedule.js"></script>
</body>
</html>
