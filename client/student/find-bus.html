<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find Bus – UniBus</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Dashboard base (sidebar, topbar) -->
    <link rel="stylesheet" href="/css/dashboard.css">

    <!-- Find Bus styles -->
    <link rel="stylesheet" href="/css/find-bus.css">
</head>
<body>

<!-- ============================================================
     SIDEBAR
============================================================ -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <span class="brand-icon">🚌</span>
        <span class="brand-text">Uni<span>Bus</span></span>
    </div>

    <nav class="sidebar-nav">
        <a href="/student/dashboard.html" class="nav-item">
            <i class="fas fa-th-large"></i><span>Dashboard</span>
        </a>
        <a href="/student/classes.html" class="nav-item">
            <i class="fas fa-calendar-alt"></i><span>My Classes</span>
        </a>
        <a href="/student/find-bus.html" class="nav-item active">
            <i class="fas fa-search"></i><span>Find Bus</span>
        </a>
        <a href="/student/bookings.html" class="nav-item">
            <i class="fas fa-ticket-alt"></i><span>My Bookings</span>
        </a>
        <a href="/student/track-bus.html" class="nav-item">
            <i class="fas fa-map-marked-alt"></i><span>Track Bus</span>
        </a>
        <a href="/student/profile.html" class="nav-item">
            <i class="fas fa-user"></i><span>Profile</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <button class="logout-btn" id="logoutBtn">
            <i class="fas fa-sign-out-alt"></i><span>Logout</span>
        </button>
    </div>
</aside>

<!-- ============================================================
     MAIN CONTENT
============================================================ -->
<div class="main-content" id="mainContent">

    <!-- TOP BAR -->
    <header class="topbar">
        <button class="menu-toggle" id="menuToggle">
            <i class="fas fa-bars"></i>
        </button>

        <div class="topbar-right">
            <div class="user-menu">
                <div class="user-avatar" id="userAvatar">S</div>
                <div class="user-info">
                    <span class="user-name" id="userName">Student</span>
                    <span class="user-role" id="userRole">student</span>
                </div>
            </div>
        </div>
    </header>

    <!-- PAGE HEADER -->
    <div class="page-header">
        <div>
            <h1>Find Bus</h1>
            <p>Search and book a bus for your class schedule.</p>
        </div>
    </div>

    <!-- ============================================================
         SEARCH / FILTER BAR
    ============================================================ -->
    <div class="search-bar">
        <div class="search-field">
            <label><i class="fas fa-calendar-day"></i> Travel Date</label>
            <input type="date" id="filterDate" />
        </div>

        <div class="search-field">
            <label><i class="fas fa-exchange-alt"></i> Direction</label>
            <select id="filterDirection">
                <option value="outbound">Home → University</option>
                <option value="return">University → Home</option>
            </select>
        </div>

        <div class="search-field">
            <label><i class="fas fa-sort"></i> Sort By</label>
            <select id="filterSort">
                <option value="recommended">Recommended</option>
                <option value="departure">Departure Time</option>
                <option value="seats">Seats Available</option>
            </select>
        </div>

        <div class="search-actions">
            <button class="btn-search" id="searchBtn">
                <i class="fas fa-search"></i> Search
            </button>
            <button class="btn-reset" id="resetBtn">
                <i class="fas fa-redo"></i> Reset
            </button>
        </div>
    </div>

    <!-- ============================================================
         RECOMMENDATION BANNER
    ============================================================ -->
    <div id="recommendationBanner"></div>

    <!-- ============================================================
         BUS LIST
    ============================================================ -->
    <div class="bus-list-header">
        <h2>Available Buses</h2>
        <span class="bus-count" id="busCount">0 buses</span>
    </div>

    <div id="busList">
        <!-- Loading skeleton initially -->
        <div class="bus-card skeleton-card">
            <div class="skeleton-line"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line"></div>
        </div>
        <div class="bus-card skeleton-card">
            <div class="skeleton-line"></div>
            <div class="skeleton-line"></div>
        </div>
    </div>

</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

  <script src="../js/api.js"></script>
<script src="/js/student/find-bus.js"></script>
</body>
</html>
